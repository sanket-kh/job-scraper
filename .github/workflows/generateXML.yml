name: To Generate XML and Store in Supabase

on:
  schedule:
    - cron: "30 23 * * *" # Every day at 11:30 PM UTC => 5:00 AM IST
  workflow_dispatch: # ✅ Add this to allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scraper/job_portal_extractor

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment and install dependencies
        run: |
          # Create a virtual environment
          uv venv

          # Source the virtual environment
          source .venv/bin/activate

          # Install the package in development mode
          uv pip install -r requirements.txt

          # Install Playwright browsers
          python -m playwright install

      - name: Execute CV Library script
        run: |
          source .venv/bin/activate
           uv run generate-xml.py
